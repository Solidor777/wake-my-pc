# daemon: PC-side service. Listens on LAN (TCP+TLS 1.3 mTLS, locked decision),
# accepts authenticated Sleep/Lock/PowerOff commands, calls OS sleep API,
# advertises state.
#
# `unsafe` is permitted here only with `// SAFETY:` comments — typically for
# Win32 / IOKit / DBus FFI. Every block must be reviewed (Principle 2).
#
# Locked architectural choices for M2 (PLAN.md + 2026-05-08 session):
#   - Async runtime: tokio (multi-thread). Multi-task daemon (TCP accept,
#     per-conn protocol loop, periodic state monitor, future mDNS responder
#     and revoke-retry queue) composes via `select!`.
#   - TLS: tokio-rustls 0.26 paired with rustls 0.23 from core::crypto.
#   - Keystore at-rest: postcard inside DPAPI (Win); Keychain (Mac) and
#     libsecret-or-machine-id-AEAD (Linux) land in their respective sessions.
#
# This session's scope is Windows-only end-to-end. macOS + Linux platform
# code lives in `platform/{macos,linux}.rs` placeholders that compile-stub
# until those sessions land. PLAN.md M2 + POST_WORK_FINDINGS track this.

[package]
name         = "wake-my-pc-daemon"
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true

[lints]
workspace = true

[dependencies]
wake-my-pc-core = { path = "../core" }

# Async runtime + TLS.
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls       = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"

# CLI + config.
clap         = { version = "4", features = ["derive"] }
directories  = "6"

# Persistence + serialization.
serde        = { version = "1", features = ["derive"] }
postcard     = { version = "1.1", features = ["alloc"] }

# Logging.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors.
thiserror = "2"

# Used everywhere.
anyhow = "1"

# OS rng (pairing flow currently uses core::crypto's getrandom — but daemon
# also wants it for misc one-shot needs; pulled here so we don't reach into
# core's private RNG indirectly).
getrandom = "0.2"

# Windows-only OS API surface. Each call wraps an unsafe block with a
# SAFETY: comment per Principle 2.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_Networking_WindowsWebServices",
] }
# SCM service entry points (service_main, dispatcher, control handler).
# Pulls a small subset of windows-rs internally; we wrap it with our own
# safe shim in `daemon::service`.
windows-service = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"

[lib]
name = "wake_my_pc_daemon"
path = "src/lib.rs"

[[bin]]
name = "wake-my-pc-daemon"
path = "src/main.rs"

# cargo-wix MSI metadata. Build with:
#   cargo install cargo-wix
#   cargo wix --package wake-my-pc-daemon -p wake-my-pc-daemon
# Requires the WiX 3.x SDK (`candle.exe` + `light.exe`) on PATH. CI
# runs this on the pre-release workflow only — per-PR doesn't need it.
[package.metadata.wix]
# Pull in the WixUtilExtension for `util:PermissionEx` (the data-dir ACL).
include = ["wix/main.wxs"]
# These flags get appended to the `light.exe` invocation cargo-wix runs.
# `-ext WixUtilExtension` registers the extension that provides
# util:PermissionEx; without it, the .wxs fails to compile.
compiler-args = ["-ext", "WixUtilExtension"]
linker-args = ["-ext", "WixUtilExtension"]
