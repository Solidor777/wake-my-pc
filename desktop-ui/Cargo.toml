# desktop-ui: Win/Mac/Linux client UI. egui via eframe (locked decision).
#
# `unsafe` permitted only with `// SAFETY:` comments (Principle 2).
#
# eframe's transitive winit/wgpu stack is the largest unsafe surface we depend
# on; that's accepted because it's well-audited and the alternative (writing
# our own windowing + GPU layer) is far worse for safety.

[package]
name         = "wake-my-pc-desktop"
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true

[lints]
workspace = true

[dependencies]
wake-my-pc-core = { path = "../core" }
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }

[[bin]]
name = "wake-my-pc-desktop"
path = "src/main.rs"
