# Per-PR CI: cheap subset per Principle 4 (softened CI clause).
# Builds + tests core / daemon / desktop-ui on Linux, macOS, Windows.
# Mobile builds are NOT in this workflow — they run in pre-release.yml or
# on PRs labeled `mobile-ci` (see PRINCIPLES.md and docs/TODO.md for the
# revisit-end-of-M4 question on whether to sample mobile per-PR).

name: per-pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # eframe (egui's app framework) needs X11 + GL headers on Linux even
      # for `cargo build`. macOS / Windows runners have what they need.
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libssl-dev

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      - name: cargo build --workspace --release
        run: cargo build --workspace --release

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # Principle 1: every PR must pass advisory check. Failure here blocks
    # merge until either the dep is bumped or the advisory is reviewed and
    # ignored with justification in deny.toml.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
