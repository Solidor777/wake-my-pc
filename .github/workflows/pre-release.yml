# Pre-release CI: full five-platform gate per Principle 4.
# This is the hard release gate — every release tag must pass this workflow.
# Also triggers on PRs labeled `mobile-ci` (sampling mechanism for catching
# mobile regressions before release; see docs/TODO.md "Per-PR mobile CI
# economics" for the end-of-M4 revisit).
#
# M0 status: this workflow is a SCAFFOLD. iOS and Android jobs assume the
# mobile shells exist (see ios/README.md, android/README.md). They will
# fail until those scaffolds are filled in. That's intentional — the CI
# infrastructure exists from day 1 even though the mobile content doesn't.

name: pre-release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The same desktop matrix as per-pr.yml, repeated here so a release tag
  # is fully self-contained (re-runs all checks on the tagged commit).
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --workspace --release

  ios:
    name: ios / simulator build
    # Only fire on the mobile-ci label or release tags — macOS runners are
    # the most expensive in the matrix.
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.pull_request.labels.*.name, 'mobile-ci')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add iOS Simulator target
        run: rustup target add aarch64-apple-ios-sim
      - name: Build bindings for iOS Simulator
        run: cargo build -p wake-my-pc-bindings --target aarch64-apple-ios-sim --release
      # The Xcode build step lands once ios/ scaffold exists. Until then
      # the bindings build above proves the Rust side compiles for iOS.

  android:
    name: android / emulator build
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.pull_request.labels.*.name, 'mobile-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build bindings for Android
        run: cargo ndk -t arm64-v8a -t x86_64 -p wake-my-pc-bindings build --release
      # The Gradle build step lands once android/ scaffold exists.
